<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CodeAlpha E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Simple E-Commerce Store</h1>
        <div class="cart-icon"> Cart (<span id="cart-count">0</span>)</div>
    </header>

    <main>
        <!--  PRODUCTS SECTION -->
        <section class="products-section">
            <h2>Our Products</h2>
            <div class="products-container" id="products-container">
                
                <!-- 1. Laptop -->
                <div class="product-card">
                    <h3>Laptop</h3>
                    <p>Price: Rs. 75000</p>
                    <button onclick="showDetails('Laptop', '8GB RAM, 256GB SSD, Fast Performance.', 75000)">Details</button>
                    <button onclick="addToCart('Laptop', 75000)">Add to Cart</button>
                </div>

                <!-- 2. Smartphone -->
                <div class="product-card">
                    <h3>Smartphone</h3>
                    <p>Price: Rs. 35000</p>
                    <button onclick="showDetails('Smartphone', '6.5 inch Screen, 128GB Storage.', 35000)">Details</button>
                    <button onclick="addToCart('Smartphone', 35000)">Add to Cart</button>
                </div>

                <!-- 3. Headphones -->
                <div class="product-card">
                    <h3>Headphones</h3>
                    <p>Price: Rs. 5000</p>
                    <button onclick="showDetails('Headphones', 'Wireless Bluetooth Headphones with Extra Bass.', 5000)">Details</button>
                    <button onclick="addToCart('Headphones', 5000)">Add to Cart</button>
                </div>

                <!-- 4. Smart Watch -->
                <div class="product-card">
                    <h3>Smart Watch</h3>
                    <p>Price: Rs. 8000</p>
                    <button onclick="showDetails('Smart Watch', 'Waterproof Smart Watch with Fitness Tracker.', 8000)">Details</button>
                    <button onclick="addToCart('Smart Watch', 8000)">Add to Cart</button>
                </div>

            </div>
        </section>

        <!--  CART SECTION -->
        <section class="cart-section">
            <h2>Your Shopping Cart</h2>
            <div id="cart-items"><p>Your cart is empty.</p></div>
            <div class="cart-total">
                <h3>Total: Rs. <span id="cart-total-price">0</span></h3>
                <button id="checkout-btn" onclick="processOrder()">Place Order</button>
            </div>
        </section>
    </main>

    <!--  DETAILS POPUP BOX (CodeAlpha Requirement) -->
    <div id="product-detail-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: white; padding: 20px; border-radius: 8px; text-align: center; width: 300px; position: relative;">
            <span onclick="closeDetails()" style="position: absolute; top: 5px; right: 10px; font-size: 25px; cursor: pointer;">&times;</span>
            <h2 id="modal-product-name">Product Name</h2>
            <p id="modal-product-desc">Product Description</p>
            <h3 id="modal-product-price">Price: Rs. 0</h3>
            <button id="modal-add-btn" style="background: #2ecc71; color: white; padding: 10px; border: none; width: 100%; cursor: pointer;">Add to Cart</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
